version: 1.0
runtime: python3
build:
  commands:
    build:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt
run:
  runtime-version: 3.11
  command: python app.py
  network:
    port: 5000
    env: PORT
  env:
    - name: S3_BUCKET
      value: "mobilefacenet"
    - name: AWS_DEFAULT_REGION
      value: "ap-south-1"
    - name: FLASK_ENV
      value: "production"
