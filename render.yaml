services:
  - type: web
    name: face-attendance-backend
    env: docker
    plan: starter
    region: singapore
    envVars:
      - key: S3_BUCKET
        value: mobilefacenet
      - key: AWS_DEFAULT_REGION
        value: ap-south-1
      - key: FLASK_ENV
        value: production
      - key: PYTHONPATH
        value: /app
    healthCheckPath: /
    autoDeploy: true
